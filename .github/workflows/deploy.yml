name: Deploy Frontend to Cloudflare Workers

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Workers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set API URL based on branch
        id: env-vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "api_url=${{ secrets.NEXT_PUBLIC_API_URL || '' }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ secrets.NEXT_PUBLIC_DEV_API_URL || secrets.NEXT_PUBLIC_API_URL || '' }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Next.js for Cloudflare Workers
        run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.env-vars.outputs.api_url }}

      - name: Deploy OpenNext Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npm run deploy:cloudflare -- --name frustratedbox-web
          else
            npm run deploy:cloudflare -- --name frustratedbox-web-${{ github.ref_name }}
          fi
