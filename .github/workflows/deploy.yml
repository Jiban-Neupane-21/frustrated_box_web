name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set API URL based on branch
        id: env-vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "api_url=${{ secrets.NEXT_PUBLIC_API_URL || '' }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ secrets.NEXT_PUBLIC_DEV_API_URL || secrets.NEXT_PUBLIC_API_URL || '' }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.env-vars.outputs.api_url }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create frustratedbox-web --production-branch=main || true
          npx wrangler pages deploy out --project-name=frustratedbox-web --branch=${{ github.ref_name }} --commit-dirty=true
