<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Dark background box with rounded corners and border -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#050505" stroke="#3f1418" stroke-width="3" />
  
  <!-- Centered Frustrated Box 3D Isometric View -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Top Face -->
    <polygon
      points="50,14 84,32 50,50 16,32"
      fill="#1c1917"
      stroke="#3f3f46"
      stroke-width="3"
    />
    <!-- Left Face -->
    <polygon
      points="16,32 50,50 50,86 16,68"
      fill="#09090b"
      stroke="#3f3f46"
      stroke-width="3"
    />
    <!-- Right Face -->
    <polygon
      points="50,50 84,32 84,68 50,86"
      fill="#140a0c"
      stroke="#5a181d"
      stroke-width="3"
    />
    <!-- Glowing Red Crack -->
    <path
      d="M 50 50 L 62 58 L 56 66 L 72 73 L 64 81 L 68 86"
      stroke="#ef4444"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
